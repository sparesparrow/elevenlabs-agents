[project]
name = "elevenlabs-agents"
version = "0.1.0"
description = "ElevenLabs voice synthesis and MCP integration for MIA IoT control system"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "MIA Project" }]
keywords = ["mcp", "elevenlabs", "voice", "tts", "iot", "mia"]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Home Automation",
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "mcp>=1.0.0",
    "websockets>=12.0",
    "aiomqtt>=1.2.0",
]

[project.optional-dependencies]
audio = [
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
]
homeassistant = [
    "aiohttp>=3.9.0",
]
anthropic = [
    "anthropic>=0.25.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "coverage>=7.0.0",
]

[project.scripts]
elevenlabs-mcp-server = "src:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]  # sys.path manipulation must precede local imports

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true